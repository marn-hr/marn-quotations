<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="light dark">
<title>Marn · عرض السعر ونطاق العمل</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23056D69'/%3E%3Cpath d='M9 22V10h3l4 6 4-6h3v12h-3v-7l-4 6-4-6v7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;font-style:normal;font-display:swap;src:url(IBMPlexSansArabic-Regular.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:500;font-style:normal;font-display:swap;src:url(IBMPlexSansArabic-Medium.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:600;font-style:normal;font-display:swap;src:url(IBMPlexSansArabic-SemiBold.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:700;font-style:normal;font-display:swap;src:url(IBMPlexSansArabic-Bold.woff2) format("woff2")}
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F1EDE6; --ink:#1B191A; --muted:#6B6560; --rule:#D9D4CC;
  --accent:#056D69; --accent-ink:#FFFFFF; --accent-soft:#E3F0EE; --chip:#E9E5DE;
  --err:#A4281F; --err-soft:#F8E6E3; --warn:#7A5300; --warn-soft:#F6EEDB; --ok:#056D69;
  --sheet:#FFFFFF; --sheet-ink:#1B191A; --sheet-muted:#6B6560; --sheet-rule:#D9D4CC; --sheet-zebra:#F6F3EE; --sheet-head:#1B191A;
  --font:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif; --mono:var(--font);
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161415; --surface:#211F20; --surface-2:#2A2728; --ink:#F3EFE8; --muted:#A8A39C; --rule:#3A3637;
  --accent:#7FCFC4; --accent-ink:#0F1F1D; --accent-soft:#1F3532; --chip:#2E2B2C;
  --err:#F2A49B; --err-soft:#3A2220; --warn:#E9C27A; --warn-soft:#3A2F18; --ok:#7FCFC4;
  --sheet:#FBF9F5; --sheet-ink:#1B191A; --sheet-muted:#5E5853; --sheet-rule:#D9D4CC; --sheet-zebra:#F2EEE7; --sheet-head:#1B191A;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#161415; --surface:#211F20; --surface-2:#2A2728; --ink:#F3EFE8; --muted:#A8A39C; --rule:#3A3637;
  --accent:#7FCFC4; --accent-ink:#0F1F1D; --accent-soft:#1F3532; --chip:#2E2B2C;
  --err:#F2A49B; --err-soft:#3A2220; --warn:#E9C27A; --warn-soft:#3A2F18; --ok:#7FCFC4;
  --sheet:#FBF9F5; --sheet-ink:#1B191A; --sheet-muted:#5E5853; --sheet-rule:#D9D4CC; --sheet-zebra:#F2EEE7; --sheet-head:#1B191A;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;max-width:1500px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:30px;width:auto;display:block}
.brand b{font-size:17px;white-space:nowrap}
.brand .lib{font-size:12px;color:var(--muted);white-space:nowrap}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-inline-start:auto}
nav.tabs a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.langbtn{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer}
main{max-width:1500px;margin:0 auto;padding-block:18px 48px}
.notice{border:1px solid var(--rule);background:var(--surface);border-radius:var(--r);padding:16px 18px;max-width:760px}
.notice h2{margin:0 0 6px;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.2px}

/* builder */
.desk{display:grid;grid-template-columns:minmax(330px,460px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1100px){.desk{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px}
.panel+.panel{margin-top:14px}
.panel h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.panel h2 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--bg);padding:8px 10px;min-width:0}
.field textarea{min-height:72px;resize:vertical}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:4px}
.check input{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);background:var(--chip);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--accent)}
.search{width:100%;border:1px solid var(--rule);border-radius:8px;background:var(--bg);padding:8px 10px;margin-bottom:10px}
details.fam{border-top:1px solid var(--rule)}
details.fam:first-of-type{border-top:0}
details.fam summary{cursor:pointer;padding:10px 2px;font-weight:600;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.fam summary::-webkit-details-marker{display:none}
details.fam summary .cnt{font-weight:500;color:var(--muted);font-size:13px}
details.fam summary .cnt.on{color:var(--accent)}
.prow{padding:7px 2px;border-top:1px dashed var(--rule)}
.prow .pick{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.prow .pick input{margin-top:5px;flex:none}
.prow .pname{font-weight:500}
.prow .punit{display:block;color:var(--muted);font-size:12.5px}
.prow.on{background:var(--accent-soft);border-radius:8px;border-top-color:transparent;padding-inline:8px}
.popts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px;padding-inline-start:26px}
.popts label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.popts input[type=number]{width:72px}
.popts input,.popts select{border:1px solid var(--rule);border-radius:7px;background:var(--surface);padding:5px 8px}
.issues{display:flex;flex-direction:column;gap:8px}
.issue{border-radius:8px;padding:9px 12px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.issue.err{background:var(--err-soft);color:var(--err)}
.issue.warn{background:var(--warn-soft);color:var(--warn)}
.issue.ok{background:var(--accent-soft);color:var(--ok)}
.issue .fix{flex:none;border:1px solid currentColor;background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer;color:inherit;font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.toast{position:fixed;inset-inline-start:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:20;max-width:min(520px,calc(100vw - 32px))}
.statusline{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--chip)}
.pill.ok{background:var(--accent-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

/* paper preview */
.paperbox{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:1100px){.paperbox{position:static}}
.paperhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.paperhead h2{margin:0;font-size:16px}
.paper{background:var(--sheet);color:var(--sheet-ink);border:1px solid var(--rule);border-radius:6px;box-shadow:0 1px 0 var(--rule);max-height:calc(100vh - 170px);overflow:auto;padding:28px 30px}
@media (max-width:1100px){.paper{max-height:none;padding:20px 16px}}
/* library */
.libtop{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h3{margin:0 0 2px;font-size:15.5px}
.card .u{font-size:12.5px;color:var(--muted)}
.card .lbl{font-weight:600;font-size:12.5px;margin-top:8px}
.card ul{margin:2px 0;padding-inline-start:18px;font-size:13px}
.card .ed{margin-top:10px}
.famh{font-size:17px;margin:22px 0 10px}
.famh:first-child{margin-top:4px}
.hiddenp{opacity:.55}

/* register */
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)}
table.reg{border-collapse:collapse;width:100%;min-width:760px;font-size:13.5px}
table.reg th,table.reg td{padding:9px 12px;border-bottom:1px solid var(--rule);text-align:start;white-space:nowrap}
table.reg th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface-2)}
table.reg tbody tr{cursor:pointer}
table.reg tbody tr:hover td{background:var(--accent-soft)}
.regtop{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-size:22px}
.stat span{font-size:12.5px;color:var(--muted)}

/* editor dialog */
.modal{position:fixed;inset:0;background:rgba(10,9,9,.55);z-index:30;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;max-width:900px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:18px}
.modal .box h2{margin:0 0 4px;font-size:18px}
.edgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
@media (max-width:700px){.edgrid{grid-template-columns:1fr}}
.edgrid textarea{min-height:110px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.grow{flex:1 1 0}
/* additions for the website edition */
[hidden]{display:none!important}
.mono{font-family:var(--font);font-variant-numeric:tabular-nums;letter-spacing:.2px}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.userchip b{color:var(--ink);font-weight:500;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip .role{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:12px;white-space:nowrap}
.linkbtn{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:4px 6px;font-size:13px;text-decoration:underline}
.signin{max-width:460px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:30px 28px;text-align:center}
.signin img{height:44px;width:auto;margin-bottom:14px}
.signin h1{font-size:22px;margin:0 0 6px}
.signin p{color:var(--muted);margin:0 0 18px}
.signin .btn{width:100%;padding:12px 16px;font-size:15.5px}
.signin .err{margin-top:14px;background:var(--err-soft);color:var(--err);border-radius:8px;padding:9px 12px;font-size:13.5px;text-align:start}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pprice{color:var(--accent);font-weight:600;white-space:nowrap}
.pprice.miss{color:var(--err)}
.sumbox{border:1px solid var(--rule);border-radius:9px;background:var(--bg);padding:10px 12px;margin-bottom:12px}
.sumbox div{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14px}
.sumbox div.grand{border-top:1px solid var(--rule);margin-top:4px;padding-top:8px;font-weight:700;font-size:16px}
.sumbox div span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.viewnums{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 6px}
.viewnums .mono{font-size:17px;font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btnrow .btn{padding:8px 13px;font-size:14px}
.btnlbl{font-size:12.5px;color:var(--muted);margin:14px 0 0}
details.plist{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:0 16px;margin-bottom:14px}
details.plist summary{cursor:pointer;padding:12px 0;font-weight:600}
table.ptab{border-collapse:collapse;width:100%;font-size:13.5px;margin-bottom:14px}
table.ptab th,table.ptab td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:start}
table.ptab th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface-2)}
table.ptab td.num,table.ptab th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
table.ptab tr.diff td{background:var(--warn-soft)}
.admgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px;align-items:start}
.admgrid .panel+.panel{margin-top:0}
.admgrid textarea{min-height:120px;font-size:13.5px}
.admgrid .ltr{direction:ltr;text-align:left}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.varprice{display:grid;grid-template-columns:1fr 130px;gap:6px 10px;align-items:center;margin-top:6px}
.varprice input{border:1px solid var(--rule);border-radius:7px;background:var(--bg);padding:6px 8px;width:100%}
#printArea{display:none}
@media print{
  @page{size:A4;margin:14mm 15mm 16mm}
  html,body{background:#fff!important}
  header.bar,main,.toast,.modal{display:none!important}
  body::before{display:none}
  #printArea{display:block}
  #printArea .psheet{break-after:page;page-break-after:always}
  #printArea .psheet:last-child{break-after:auto;page-break-after:auto}
  #printArea .sow{max-width:none}
  #printArea .sow th,#printArea .sow td,#printArea .sow .banner,#printArea .sow .tot td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* documents */
.sow{--sheet-ink:#1B191A;--sheet-muted:#6B6560;--sheet-rule:#D9D4CC;--sheet-zebra:#F6F3EE;--sheet-head:#1B191A;--teal:#056D69;
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color:var(--sheet-ink);font-size:13.5px;line-height:1.65;font-weight:400;max-width:760px;margin:0 auto;text-align:start;-webkit-text-size-adjust:100%}
.sow *{box-sizing:border-box}
.sow .mono{font-family:inherit;font-variant-numeric:tabular-nums;letter-spacing:.2px}
.sow .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--sheet-head);padding-bottom:12px;margin-bottom:12px}
.sow .hd img{height:46px;width:auto}
.sow .hd .tt{text-align:end}
.sow .hd .tt b{display:block;font-size:22px;font-weight:700;letter-spacing:.2px}
.sow .hd .tt span{color:var(--sheet-muted);font-size:12.5px}
.sow table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:12.5px}
.sow th,.sow td{border:1px solid var(--sheet-rule);padding:5px 8px;text-align:start;vertical-align:top}
.sow th{background:var(--sheet-head);color:#FFFFFF;font-weight:600}
.sow tbody tr:nth-child(even) td{background:var(--sheet-zebra)}
.sow table.kv td:first-child{width:32%;font-weight:600}
.sow table.meta{font-size:12px}
.sow table.meta td:first-child{width:32%;color:var(--sheet-muted)}
.sow .banner{background:#F6EEDB;color:#6A4800;border:1px solid #E9D7A8;border-radius:6px;padding:7px 10px;margin:8px 0;font-size:12.5px}
.sow h3{font-size:15.5px;font-weight:700;margin:18px 0 6px;color:var(--teal)}
.sow h3,.sow h4,.sow .lbl{break-after:avoid;page-break-after:avoid}
.sow tr,.sow li,.sow .sign,.sow .tot,.sow .parties>div{break-inside:avoid;page-break-inside:avoid}
.sow h4{font-size:14px;font-weight:700;margin:14px 0 4px;border-top:1px solid var(--sheet-rule);padding-top:10px}
.sow .lbl{font-weight:600;font-size:12.5px;margin:8px 0 2px;color:var(--sheet-ink)}
.sow ul{margin:2px 0 6px;padding-inline-start:20px}
.sow li{margin:1px 0}
.sow p{margin:4px 0}
.sow .intro{color:var(--sheet-muted)}
.sow .sign{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.sow .sign div{border:1px solid var(--sheet-rule);border-radius:6px;padding:10px 12px;min-height:150px}
.sow .sign b{display:block;margin-bottom:8px;font-weight:700}
.sow .sign p{border-bottom:1px dotted var(--sheet-rule);padding-bottom:6px;margin:8px 0;color:var(--sheet-muted);font-size:12.5px}
.sow .foot{margin-top:16px;color:var(--sheet-muted);font-size:11.5px;text-align:center}
.sow .parties{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0 4px}
.sow .parties>div{border:1px solid var(--sheet-rule);border-radius:6px;padding:10px 12px}
.sow .parties .who{font-size:11.5px;color:var(--teal);font-weight:600;margin-bottom:2px}
.sow .parties b{display:block;font-size:14.5px;font-weight:700;margin-bottom:4px}
.sow .parties p{margin:1px 0;font-size:12.5px;color:var(--sheet-muted)}
.sow .parties p span{color:var(--sheet-ink)}
.sow table.lines td.num,.sow table.lines th.num{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.sow table.lines td small{display:block;color:var(--sheet-muted);font-size:11.5px}
.sow .tot{display:flex;justify-content:flex-end;margin:4px 0 10px}
.sow .tot table{width:56%;margin:0;font-size:13px}
.sow .tot td{border:0;border-bottom:1px solid var(--sheet-rule);padding:6px 8px;background:transparent!important}
.sow .tot td:last-child{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.sow .tot tr.grand td{background:var(--teal)!important;color:#FFFFFF;font-weight:700;font-size:14.5px;border-bottom:0}
.sow .tot tr.note td{border-bottom:0;color:var(--sheet-muted);font-size:11.5px;padding-top:4px}
@media (max-width:560px){.sow .parties,.sow .sign{grid-template-columns:1fr}.sow .tot table{width:100%}}
.sow.fixed{max-width:none;width:680px;margin:0}
.sow.fixed .parties,.sow.fixed .sign{grid-template-columns:1fr 1fr}
.sow.fixed .tot table{width:56%}

</style></head><body>
<header class="bar"><div class="bar-in wrap">
  <div class="brand"><img id="logo" alt="Marn"><div><b id="appTitle">عرض السعر ونطاق العمل</b><div class="lib" id="libStatus"></div></div></div>
  <span class="grow"></span>
  <nav class="tabs" id="tabs" aria-label="sections" hidden><a href="#new" id="tab-new"></a><a href="#register" id="tab-register"></a><a href="#library" id="tab-library"></a><a href="#admin" id="tab-admin" hidden></a></nav>
  <div class="userchip" id="userchip" hidden><b id="uName"></b><span class="role" id="uRole"></span><button class="linkbtn" id="outBtn" type="button"></button></div>

const P=id=>S.lib.products[id];
const fam=id=>(S.lib.common&&S.lib.common.families&&S.lib.common.families[id])||{};
const famOrder=f=>(fam(f).order||9);
function nm(p,lang){return lang==="ar"?p.name_ar:p.name_en}
function activeProducts(){return Object.values(S.lib.products).filter(p=>p.active!==false).sort((a,b)=>famOrder(a.family)-famOrder(b.family)||(a.order||0)-(b.order||0))}
function termText(p,it,lang){
  if(p.billing==="one_time")return lang==="ar"?"مرة واحدة":"One time";
  if(p.billing==="purchase")return lang==="ar"?"شراء":"Purchase";
  if(p.billing==="per_quote"||!(p.terms&&p.terms.length))return lang==="ar"?"حسب عرض السعر":"As per quote";
  const n=it.term||p.defaultTerm||p.terms[0];return lang==="ar"?monthsAr(n):n+" months"}

  .sort((a,b)=>famOrder(P(a.id).family)-famOrder(P(b.id).family)||(P(a.id).order||0)-(P(b.id).order||0))}

function check(form,lang){
  const L=lang||S.lang, out={errors:[],warnings:[]};const c=form.customer;const sel=selectedSet(form);
  const name=id=>P(id)?nm(P(id),L):id;
  if(!c.name.trim())out.errors.push({msg:t("errName")});
  if(!(Number(c.branches)>=1))out.errors.push({msg:t("errBranches")});
  const items=itemsOf(form);if(!items.length)out.errors.push({msg:t("errItems")});
  const cov=((S.lib.common&&S.lib.common.coverage_cities)||[]);
  for(const it of items){const p=P(it.id);
    if(p.requiresAny&&p.requiresAny.length&&!p.requiresAny.some(r=>sel.has(r))&&!(form.existing&&p.existingOk!==false&&!p.requiresLabel_ar)){
      const label=p.requiresLabel_ar?(L==="ar"?p.requiresLabel_ar:p.requiresLabel_en):t("needCashier");
      const fixId=p.requiresAny.includes("cashier")?"cashier":(p.requiresAny.includes("deliverect")?null:null);
      out.errors.push({msg:name(p.id)+": "+t("needs")+" "+label+".",fix:fixId?{id:fixId,label:t("addIt")+" "+name(fixId)}:null})}

  const ta=(id,lab,val,cls,dis)=>`<div class="field full"><label for="${id}">${esc(lab)}</label><textarea id="${id}" class="${cls||""}" ${dis?"disabled":""}>${esc((val||[]).join("\n"))}</textarea></div>`;
  const inp=(id,lab,val,type)=>`<div class="field"><label for="${id}">${esc(lab)}</label><input id="${id}" ${type?`type="${type}" min="0" step="any"`:""} value="${esc(val??"")}"></div>`;
  $("#main").innerHTML=`<div class="admgrid" id="admRoot">
   <div class="panel"><h2>${esc(t("admAccess"))}</h2><p class="hint" style="margin:-6px 0 10px">${esc(t("admEmails"))}</p>
     ${ta("ac-sales",t("admSales"),a.sales,"ltr")}${ta("ac-managers",t("admManagers"),a.managers,"ltr")}${ta("ac-admins",t("admAdmins"),a.admins,"ltr",!S.owner)}
     ${S.owner?"":`<p class="hint">${esc(t("admOwnerOnly"))}</p>`}<div class="actions"><button class="btn primary" id="acSave">${esc(t("save"))}</button></div></div>
   <div class="panel"><h2>${esc(t("admSettings"))}</h2><div class="grid2">
     ${inp("st-legal_ar",t("stLegalAr"),st.legal_ar)}${inp("st-legal_en",t("stLegalEn"),st.legal_en)}${inp("st-cr",t("stCr"),st.cr)}${inp("st-vat",t("stVat"),st.vat)}
     ${inp("st-address_ar",t("stAddrAr"),st.address_ar)}${inp("st-address_en",t("stAddrEn"),st.address_en)}${inp("st-contact",t("stContact"),st.contact)}<span></span>
     ${inp("st-vatRate",t("stVatRate"),st.vatRate,"number")}${inp("st-validDays",t("stValid"),st.validDays,"number")}
     ${ta("st-terms_ar",t("stTermsAr"),st.terms_ar)}${ta("st-terms_en",t("stTermsEn"),st.terms_en,"ltr")}<p class="hint" style="grid-column:1/-1;margin:-4px 0 4px">${esc(t("stHint"))}</p>
     ${ta("st-bank_ar",t("stBankAr"),st.bank_ar)}${ta("st-bank_en",t("stBankEn"),st.bank_en,"ltr")}</div>
     <div class="actions"><button class="btn primary" id="stSave">${esc(t("save"))}</button></div></div>
   <div class="panel"><h2>${esc(t("admData"))}</h2><p style="margin:0 0 4px"><b class="mono">${n}</b> ${esc(t("admCount"))}</p><p class="hint">${esc(t("admDataHint"))}</p>
     <input type="file" id="impFile" accept="application/json,.json" hidden>
     <div class="actions"><button class="btn ${n?"":"primary"}" id="impBtn">${esc(t("admImport"))}</button><button class="btn" id="expBtn" ${n?"":"disabled"}>${esc(t("admExport"))}</button></div></div></div>`;
  $("#acSave").onclick=async e=>{const s=parseEmails($("#ac-sales").value),m=parseEmails($("#ac-managers").value),ad=S.owner?parseEmails($("#ac-admins").value):{ok:(a.admins||[]),bad:[]};
    const bad=[...s.bad,...m.bad,...ad.bad];if(bad.length){toast(t("admBad")+bad.join(" , "));return}e.currentTarget.disabled=true;
    const v={sales:s.ok,managers:m.ok,admins:ad.ok,updatedAt:new Date().toISOString(),updatedBy:S.me.email};
    try{await S.db.doc("sow_access/list").set(v);S.access=v;toast(t("admSaved"));renderAdmin()}catch(x){e.currentTarget.disabled=false;toast(x&&x.code==="permission-denied"?t("noWrite"):t("issueFail"))}};
  $("#stSave").onclick=async e=>{const g=k=>$("#st-"+k).value;const v={legal_ar:g("legal_ar").trim(),legal_en:g("legal_en").trim(),cr:g("cr").trim(),vat:g("vat").trim(),address_ar:g("address_ar").trim(),address_en:g("address_en").trim(),contact:g("contact").trim(),
      vatRate:Math.max(0,Number(g("vatRate"))||0),validDays:Math.max(1,parseInt(g("validDays"),10)||14),terms_ar:toLines(g("terms_ar")),terms_en:toLines(g("terms_en")),bank_ar:toLines(g("bank_ar")),bank_en:toLines(g("bank_en")),updatedAt:new Date().toISOString(),updatedBy:S.me.email};
    e.currentTarget.disabled=true;try{await S.db.doc("sow_meta/settings").set(v);S.settings=v;toast(t("stSaved"));renderAdmin()}catch(x){e.currentTarget.disabled=false;toast(x&&x.code==="permission-denied"?t("noWrite"):t("issueFail"))}};
  $("#impBtn").onclick=()=>{if(n&&!S.impArm){S.impArm=true;$("#impBtn").textContent=t("admImportAsk");return}$("#impFile").click()};
  $("#impFile").onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;let d=null;try{d=JSON.parse(await f.text())}catch(x){}
    if(!d||d.format!=="marn-sow-seed"||!d.products||typeof d.products!=="object"){toast(t("admImportBad"));return}
    $("#impBtn").disabled=true;try{const ids=Object.keys(d.products);
      for(let i=0;i<ids.length;i+=20)await Promise.all(ids.slice(i,i+20).map(id=>S.db.doc("sow_library/"+id).set({...d.products[id],id,kind:"product"})));
      if(d.common)await S.db.doc("sow_library/_common").set({...d.common,kind:"common"});
      if(d.meta)await S.db.doc("sow_meta/library").set(d.meta);
      if(d.settings&&!S.settings){await S.db.doc("sow_meta/settings").set(d.settings);S.settings=d.settings}
      toast(t("admImported")+ids.length);renderAdmin()}catch(x){$("#impBtn").disabled=false;toast(x&&x.code==="permission-denied"?t("noWrite"):t("issueFail"))}};
  $("#expBtn").onclick=()=>{const prods={};for(const [id,p] of Object.entries(S.lib.products))prods[id]=p;
    saveBlob("marn_sow_library_backup_"+new Date().toISOString().slice(0,10)+".json",new Blob([JSON.stringify({format:"marn-sow-seed",formatVersion:1,generated:new Date().toISOString().slice(0,10),products:prods,common:S.lib.common,meta:S.lib.meta,settings:S.settings},null,1)],{type:"application/json"}))}}

boot();

</script>
</body></html>
